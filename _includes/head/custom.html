{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- favicon from UT Austin -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="#bf5700"/>

{% if page.uses_news_assets %}
<link rel="stylesheet" href="{{ base_path }}/assets/css/news.css"/>
{% endif %}

{% if page.uses_misc_hub_assets %}
<!-- Field Notes hub: Fraunces (optical serif) for an editorial "contents page" -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,380..480&display=swap"/>
<link rel="stylesheet" href="{{ base_path }}/assets/css/misc.css"/>
{% endif %}

{% if page.uses_publications_assets %}
<!-- Lato webfont for the publications section (matches reference typography) -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400;1,700&display=swap"/>
<link rel="stylesheet" href="{{ base_path }}/assets/css/publications.css"/>
{% endif %}

<!-- end custom head snippets -->
